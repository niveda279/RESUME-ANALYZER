name: CareerCast CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      MODEL_ACCURACY_THRESHOLD: 0.80

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Model Training & Evaluation (if needed)
      run: |
        # Train model locally before running accuracy tests
        python backend/train_model.py

    - name: Run Unit Tests and Accuracy Gate
      run: |
        # Run tests excluding frontend for now
        pytest backend/tests/
